  redis-api-cache:
    image: redis:7.2-bookworm
    container_name: flink-client
    hostname: flink-client
    restart: always
    env_file:
      - ${PROJECT_DIR}/.env
    volumes:
      - redis-cache-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"
    networks:
      - hadoop_net

volumes:
  redis-cache-data:
    driver: local

networks:
  hadoop_net:
    external: true