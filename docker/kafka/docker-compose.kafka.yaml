x-kafka-template: &kafka-template
  image: apache/kafka:4.2.2
  environment: &kafka-env
    CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
    KAFKA_PROCESS_ROLES: broker,controller

    KAFKA_LISTENERS: >
      INTERNAL://:19092,
      EXTERNAL://:9092,
      CONTROLLER://:9093

    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
      CONTROLLER:PLAINTEXT,
      INTERNAL:SASL_PLAINTEXT,
      EXTERNAL:SASL_PLAINTEXT

    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_CONTROLLER_QUORUM_VOTERS: >
      1@kafka-1:9093,
      2@kafka-2:9093,
      3@kafka-3:9093

    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
    KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN

    KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG: >
      org.apache.kafka.common.security.plain.PlainLoginModule required
      username="${KAFKA__USERNAME}"
      password="${KAFKA__PASSWORD}"
      user_${KAFKA__USERNAME}="${KAFKA__PASSWORD}";
    KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: >
      org.apache.kafka.common.security.plain.PlainLoginModule required
      user_${KAFKA__USERNAME}="${KAFKA__PASSWORD}";

    # Hemat RAM
    KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"

  healthcheck:
    test: ["CMD-SHELL", "nc -z localhost 19092 || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 30s


services:
  kafka-1:
    <<: *kafka-template
    container_name: kafka-1
    ports:
      - 29092:9092
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: >
        INTERNAL://kafka-1:19092,
        EXTERNAL://localhost:29092

  kafka-2:
    <<: *kafka-template
    container_name: kafka-2
    ports:
      - 39092:9092
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: >
        INTERNAL://kafka-2:19092,
        EXTERNAL://localhost:39092

  kafka-3:
    <<: *kafka-template
    container_name: kafka-3
    ports:
      - 49092:9092
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: >
        INTERNAL://kafka-3:19092,
        EXTERNAL://localhost:49092

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: >
        kafka-1:19092,
        kafka-2:19092,
        kafka-3:19092
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM: PLAIN
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG: >
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="${KAFKA__USERNAME}"
        password="${KAFKA__PASSWORD}";
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy