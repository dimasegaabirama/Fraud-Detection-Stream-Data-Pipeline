services:
  postgres:
    image: postgres:16
    container_name: postgres
    hostname: postgres
    restart: always
    env_file:
      - ${PROJECT_DIR}/.env
    environment:
      POSTGRES_USER: ${POSTGRES__USER}
      POSTGRES_PASSWORD: ${POSTGRES__PASSWORD}
      POSTGRES_DB: ${POSTGRES__DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ${PROJECT_DIR}/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"

volumes:
  postgres-data:
    driver: local