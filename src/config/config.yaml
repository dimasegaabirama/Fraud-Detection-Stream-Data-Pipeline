# === ARCHITECHTURE CONFIG ===

kafka:
  version: "4.2.2"
  bootstrap_servers: "broker_1:19092,broker_2:19092,broker_3:19092"


hadoop:
  version: "3.3.4"
  hostname: "namenode"
  port: "8020"
  conf_dir: "/etc/hadoop/conf"


hive:
  version: "3.1.3"
  hostname: "hive-server2"
  metastore_port: "9083"
  server_port: "10000"
  conf_dir: "/opt/hive/conf"
  warehouse_dir: "/opt/hive/warehouse"


redis:
  host: localhost
  port: "6379"
  db: "0"
  max_connections: 4
  socket_timeout: 5
  socket_connect_timeout: 3
  socket_keepalive: true
  decode_responses: true
  health_check_interval: 30
  protocol: 3


# === PIPELINE CONFIG ===

pipeline:
  catalog: "fraud_detection_catalog"
  database: "fraud_detection"
  parallelism: 4
  state_backend: "rocksdb"
  checkpoint_interval: 60000
  checkpoint_dir: "/opt/flink/checkpoints"
  savepoint_dir: "/opt/flink/savepoints"

sources:
  transactions:
    type: "kafka"
    topic: "transactions"
    bootstrap_servers: "broker_1:19092,broker_2:19092,broker_3:19092"

sinks:
  fact_fraud_evaluations:
    type: "hive"
    catalog: "security_risk"
    database: "fraud_analytics"
    table: "fact_fraud_evaluations"
    partitioned_by: ["year", "month", "day"]
  
  fraud_detection_results:
    type: "kafka"
    bootstrap_servers: "broker_1:19092,broker_2:19092,broker_3:19092"
    topic: "fraud_detection_results"

# === API CONFIG ===
api:
  exchange_rate:
    version: v1
    ttl_ms: 1200000
    base_currency: usd
    path: "/{version}/currencies/{currency}.min.json"
    urls:
      - "https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest"
      - "https://latest.currency-api.pages.dev"


# === RULES CONFIG ===
rules:
  score_policy:
    allow_below: 50
    otp_below: 100
    review_below: 150

  amount:
    timeout_ms: 60000
    threshold:
      low: {value: 1000.0, score: 10}
      medium: {value: 5000.0, score: 50}
      high: {value: 8000, score: 80}
    factors:
      direction:
        out: 1.0
        in: 1.2
      segment:
        business: 1.0
        individual: 1.0
        retail: 1.0
      transaction_type:
        cashout: 1.0
        payment: 1.0
        refund: 0.8
        top_up: 1.0
        transfer: 1.0
        withdrawal: 1.0

  device:
    timeout_ms: 3600000
    threshold:
      low: {value: 1.0, score: 10}
      medium: {value: 3.0, score: 50}
      high: {value: 5.0, score: 80}
    factors:
      direction:
        out: 1.0
        in: 1.2
      transaction_type:
        cashout: 1.0
        payment: 1.0
        refund: 0.8
        top_up: 1.0
        transfer: 1.0
        withdrawal: 1.0

  ip_address:
    timeout_ms: 60000
    threshold:
      low: {value: 2.0, score: 10}
      medium: {value: 4.0, score: 50}
      high: {value: 6.0, score: 80}
    factors:
      segment:
        business: 2.0
        retail: 1.3
        individual: 1.0
      transaction_type:
        cashout: 0.8
        payment: 1.0
        refund: 1.1
        top_up: 1.1
        transfer: 0.9
        withdrawal: 0.8

  speed:
    timeout_ms: 60000
    threshold:
      low: {value: 2.0, score: 10}
      medium: {value: 4.0, score: 50}
      high: {value: 6.0, score: 80}
    factors:
      segment:
        business: 1.2
        retail: 1.1
        individual: 1.0

  velocity:
    timeout_ms: 60000
    threshold:
      low: {value: 5.0, score: 10}
      medium: {value: 10.0, score: 50}
      high: {value: 20.0, score: 80}
    factors:
      direction:
        out: 1.2
        in: 1.0
      segment:
        business: 2.0
        retail: 1.3
        individual: 1.0
      transaction_type:
        cashout: 0.6
        payment: 1.5
        refund: 1.0
        top_up: 1.5
        transfer: 0.8
        withdrawal: 0.6