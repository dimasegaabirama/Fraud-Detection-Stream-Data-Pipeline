kafka:
  version: "4.2.2"
  bootstrap_servers: "broker_1:19092,broker_2:19092,broker_3:19092"

hadoop:
  version: "3.3.4"
  hostname: "namenode"
  port: "8020"
  conf_dir: "/etc/hadoop/conf"

hive:
  version: "3.1.3"
  hostname: "hive-server2"
  metastore_port: "9083"
  server_port: "10000"
  conf_dir: "/opt/hive/conf"
  warehouse_dir: "/opt/hive/warehouse"

pipeline:
  catalog: "fraud_detection_catalog"
  default_database: "fraud_detection"
  parallelism: 4
  state_backend: "rocksdb"
  checkpoint_interval: 60000
  checkpoint_dir: "/opt/flink/checkpoints"
  savepoint_dir: "/opt/flink/savepoints"
  sources:
    - name: "kafka_source"
      type: "kafka"
      bootstrap_servers: "broker_1:19092,broker_2:19092,broker_3:19092"
      topic: "fraud_detection_topic"
      group_id: "fraud_detection_group"
  sinks:
    - name: "hive_sink"
      type: "hive"
      catalog_name: "fraud_detection_catalog"
      default_database: "transactions"
      table: "daily_transactions"
      partitioned_by: ["year", "month", "day"]


rules:
  amount:
    enabled: true
    aggregation: "avg"
    group_key: ["user_id", "segment", "direction", "transaction_type"]
    agg_fields: ["amount"]
    window_minutes: 60
    threshold:
      low: {value: 1000.0, score: 10}
      medium: {value: 5000.0, score: 50}
      high: {value: 8000, score: 80}
    factors:
      direction:
        credit: 1.0
        debit: 1.2
      segment:
        business: 1.0
        individual: 1.0
        retail: 1.0
      transaction_type:
        cashout: 1.0
        payment: 1.0
        refund: 0.8
        top_up: 1.0
        transfer: 1.0
        withdrawal: 1.0

  device:
    enabled: true
    aggregation: "count"
    group_key: ["user_id", "device_id", "direction", "transaction_type"]
    agg_fields: ["device_id"]
    window_minutes: 60
    threshold:
      low: {value: 1.0, score: 10}
      medium: {value: 3.0, score: 50}
      high: {value: 5.0, score: 80}
    factors:
      direction:
        credit: 1.0
        debit: 1.2
      transaction_type:
        cashout: 1.0
        payment: 1.0
        refund: 0.8
        top_up: 1.0
        transfer: 1.0
        withdrawal: 1.0

  ip:
    enabled: true
    aggregation: "count"
    group_key: ["user_id", "ip_address", "segment", "transaction_type"]
    agg_fields: ["ip_address"]
    window_minutes: 60
    threshold:
      low: {value: 2.0, score: 10}
      medium: {value: 4.0, score: 50}
      high: {value: 6.0, score: 80}
    factors:
      segment:
        business: 2.0
        retail: 1.3
        individual: 1.0
      transaction_type:
        cashout: 0.8
        payment: 1.0
        refund: 1.1
        top_up: 1.1
        transfer: 0.9
        withdrawal: 0.8

  speed:
    enabled: true
    aggregation: "custom"
    group_key: ["user_id", "segment"]
    agg_fields: ["latitude", "longitude", "timestamp"]
    # window_minutes: None
    threshold:
      low: {value: 2.0, score: 10}
      medium: {value: 4.0, score: 50}
      high: {value: 6.0, score: 80}
    factors:
      segment:
        business: 1.2
        retail: 1.1
        individual: 1.0

  velocity:
    enabled: true
    aggregation: "count"
    group_key: ["user_id", "segment", "direction", "transaction_type"]
    agg_fields: ["transaction_id"]
    window_minutes: 60
    threshold:
      low: {value: 5.0, score: 10}
      medium: {value: 10.0, score: 50}
      high: {value: 20.0, score: 80}
    factors:
      direction:
        credit: 1.2
        debit: 1.0
      segment:
        business: 2.0
        retail: 1.3
        individual: 1.0
      transaction_type:
        cashout: 0.6
        payment: 1.5
        refund: 1.0
        top_up: 1.5
        transfer: 0.8
        withdrawal: 0.6