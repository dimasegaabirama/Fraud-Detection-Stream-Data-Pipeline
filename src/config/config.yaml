# === ARCHITECTURE CONFIG ===

kafka:
  version: "4.2.2"
  bootstrap_servers: "broker_1:19092,broker_2:19092,broker_3:19092"

hadoop:
  version: "3.3.4"
  hostname: "namenode"
  port: "8020"
  conf_dir: "/etc/hadoop/conf"

hive:
  version: "3.1.3"
  hostname: "hive-server2"
  metastore_port: "9083"
  server_port: "10000"
  conf_dir: "/opt/hive/conf"
  warehouse_dir: "/opt/hive/warehouse"

redis:
  host: localhost
  port: "6379"
  db: "0"
  max_connections: 4
  socket_timeout: 0.1           # seconds, keep it small: this is on the realtime path
  socket_connect_timeout: 0.5   # seconds
  socket_keepalive: true
  decode_responses: true
  health_check_interval: 30
  protocol: 3


# === PIPELINE CONFIG ===

pipeline:
  catalog: "fraud_detection_catalog"
  database: "fraud_detection"
  parallelism: 4
  state_backend: "rocksdb"      # sliding windows live in Flink keyed state
  checkpoint_interval: 60000
  checkpoint_dir: "/opt/flink/checkpoints"
  savepoint_dir: "/opt/flink/savepoints"

sources:
  transactions:
    type: "kafka"
    topic: "transactions"
    bootstrap_servers: "broker_1:19092,broker_2:19092,broker_3:19092"

sinks:
  fact_fraud_evaluations:
    type: "hive"
    catalog: "security_risk"
    database: "fraud_analytics"
    table: "fact_fraud_evaluations"
    partitioned_by: ["year", "month", "day"]

  fraud_detection_results:
    type: "kafka"
    bootstrap_servers: "broker_1:19092,broker_2:19092,broker_3:19092"
    topic: "fraud_detection_results"


# === API CONFIG ===
api:
  exchange_rate:
    version: v1
    refresh_ms: 30000
    base_currency: usd
    path: "/{version}/currencies/{currency}.min.json"
    urls:
      - "https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest"
      - "https://latest.currency-api.pages.dev"


# === RULES CONFIG ===
rules:
  # Total score = sum of all rule scores. Below `otp` -> allow.
  score_policy:
    otp: 50
    review: 100
    block: 150


  hard_block:
    device_id: device_blacklist
    ip_address: ip_blacklist
    user_id: frozen_accounts

  # window_ms = sliding window (t - size, t], kept in Flink keyed state.
  # factors multiply the thresholds: <1 stricter, >1 more lenient, missing = 1.0.

  amount:                       # USD, per user_id; score = max(single, rolling)
    threshold:                  # single transaction
      low:    {value: 1000, score: 10}
      medium: {value: 5000, score: 50}
      high:   {value: 8000, score: 80}
    rolling:                    # sum over the window
      window_ms: 86400000       # 24 hours
      threshold:
        low:    {value: 3000,  score: 10}
        medium: {value: 10000, score: 50}
        high:   {value: 20000, score: 80}
    factors:
      direction: {in: 1.2}
      segment: {business: 3.0}
      transaction_type: {refund: 0.8, cashout: 0.8, withdrawal: 0.8}

  device:                       # distinct device_id per user_id
    window_ms: 3600000          # 1 hour
    threshold:
      low:    {value: 2, score: 10}
      medium: {value: 3, score: 50}
      high:   {value: 5, score: 80}
    factors:
      direction: {in: 1.2}
      transaction_type: {refund: 0.8}

  ip_address:                   # distinct ip_address per user_id
    window_ms: 600000           # 10 minutes
    threshold:
      low:    {value: 2, score: 10}
      medium: {value: 4, score: 50}
      high:   {value: 6, score: 80}
    factors:
      segment: {business: 1.5}  # offices share an IP (NAT)
      transaction_type: {cashout: 0.8, withdrawal: 0.8, transfer: 0.9, refund: 1.1, top_up: 1.1}

  speed:                        # metric not defined yet, adjust to the real definition
    window_ms: 60000
    threshold:
      low:    {value: 2, score: 10}
      medium: {value: 4, score: 50}
      high:   {value: 6, score: 80}
    factors:
      segment: {business: 1.2, retail: 1.1}

  velocity:                     # txn count, per user_id
    window_ms: 60000
    threshold:
      low:    {value: 5,  score: 10}
      medium: {value: 10, score: 50}
      high:   {value: 20, score: 80}
    factors:
      direction: {out: 0.9}
      segment: {business: 1.5}
      transaction_type: {cashout: 0.8, withdrawal: 0.8, transfer: 0.9, payment: 1.2, top_up: 1.2}