[project]
name = "fraud-detection-streaming-pipeline"
version = "0.1.0"
description = "PyFlink fraud detection streaming pipeline (Kafka -> Flink -> Hive)"
requires-python = ">=3.10,<3.11"
dependencies = [
    "apache-flink==2.3.0",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "python-dotenv>=1.2",
    "redis>=5.3,<6",
    "pymongo>=4.18,<5",
    "typing-extensions>=4.16",
    "pendulum>=3.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
]

[tool.uv]
package = false          # application, not a library to publish

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]       # allows `from src.models...` in tests

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
